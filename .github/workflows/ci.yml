name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # ppac is Windows-only, so build and test on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Ppac.Cli -c Release

      - name: Test
        run: dotnet test tests/Ppac.Cli.Tests -c Release

      - name: Pack
        run: dotnet pack src/Ppac.Cli -c Release --no-build